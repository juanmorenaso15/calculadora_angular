<div class="calculadora">
    <app-pantalla [valor]="pantalla"></app-pantalla>

    <div class="numeros">
        <app-boton *ngFor="let n of ['7','8','9','4','5','6','1','2','3','0']" [label]="n"
            (clickBoton)="pulsar($event)">
        </app-boton>
    </div>

    <div class="operaciones">
        <app-boton label="+" (clickBoton)="pulsar($event)"></app-boton>
        <app-boton label="-" (clickBoton)="pulsar($event)"></app-boton>
        <app-boton label="*" (clickBoton)="pulsar($event)"></app-boton>
        <app-boton label="/" (clickBoton)="pulsar($event)"></app-boton>
        <app-boton label="=" (clickBoton)="pulsar($event)"></app-boton>
        <app-boton label="C" (clickBoton)="pulsar($event)"></app-boton>
        <app-boton label="DEL" (clickBoton)="pulsar($event)"></app-boton>
    </div>
</div>
